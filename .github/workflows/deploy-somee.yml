name: Deploy AttendanceSystem to Somee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AttendanceSystem.csproj

      - name: Build project
        run: dotnet build AttendanceSystem.csproj -c Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Create EF migration bundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: >
          dotnet ef migrations bundle
          --project AttendanceSystem.csproj
          --configuration Release
          --output ./efbundle

      - name: Apply migrations to Supabase
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          DEPLOYMENT_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "$DEPLOYMENT_CONNECTION_STRING"

      - name: Publish project
        run: dotnet publish AttendanceSystem.csproj -c Release -f net8.0 --no-build -o ./publish

      - name: Deploy to Somee via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /www.workers.somee.com/
