name: WebAuthn Feature CI

on:
  push:
    branches:
      - feature/webauthn-device-verification

permissions:
  contents: write

jobs:
  verify-and-generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/webauthn-device-verification

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AttendanceSystem.csproj

      - name: Build
        run: dotnet build AttendanceSystem.csproj -c Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Generate EF migration
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=attendance;Username=postgres;Password=postgres
        run: dotnet ef migrations add AddWorkerDeviceVerification --project AttendanceSystem.csproj --configuration Release

      - name: Commit generated migration and remove temporary workflow
        run: |
          rm .github/workflows/webauthn-feature-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Migrations .github/workflows/webauthn-feature-ci.yml
          git commit -m "Generate worker device verification migration"
          git push origin HEAD:feature/webauthn-device-verification
